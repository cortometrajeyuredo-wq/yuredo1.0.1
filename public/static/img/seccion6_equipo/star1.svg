      <feGaussianBlur result="blur" stdDeviation="28.23"/>
      <feFlood flood-color="#a1e5f7" flood-opacity=".7"/>
      <feComposite in2="blur" operator="in"/>
      <feComposite in="SourceGraphic"/>
    </filter>
