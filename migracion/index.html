    <!-- Script para redireccionar según dispositivo -->
    <script>
        function redirect() {
            const isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|Windows Phone/i.test(navigator.userAgent);
            const screenWidth = window.innerWidth;
            const currentPath = window.location.pathname;

            // Comprobar si ya se redirigió
            const redirectedPath = localStorage.getItem('redirectedPath');

            if (redirectedPath && redirectedPath === currentPath) {
                return; // No redirigir si ya estamos en la ruta correcta
            }

            // Redirigir según dispositivo o tamaño de pantalla
            if (isMobile || screenWidth <= 768) {
                if (currentPath !== "/movil/index.html") {
                    localStorage.setItem('redirectedPath', '/movil/index.html');
                    window.location.href = "/movil/index.html";
                }
            } else {
                if (currentPath !== "./pc/index.html") {
                    localStorage.setItem('redirectedPath', '/pc/index.html');
                    window.location.href = "/pc/index.html";
                }
            }
        }

        // Ejecutar redirección al cargar la página
        window.onload = redirect;
    </script>
